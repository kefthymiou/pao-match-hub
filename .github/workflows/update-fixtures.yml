name: Update PAO Schedule & Scores

on:
  schedule:
    # Every 3 hours
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_matches.py'
      - 'tv-overrides.json'

permissions:
  contents: write

concurrency:
  group: update-fixtures
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch fixtures (Super League, Conference League, EuroLeague, GBL)
        run: python3 scripts/update_matches.py

      - name: Commit and Push Updated Schedule
        run: |
          git config --global user.name "PAO Zone Bot"
          git config --global user.email "bot@paozone.gr"
          git add matches.json index.html sitemap.xml
          git diff --staged --quiet || (git commit -m "Auto-update PAO matches [skip ci]" && git push)
