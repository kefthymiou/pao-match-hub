<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Shamrock Favicon for Browser Tabs -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23008744'/><path d='M50 20 C40 20 32 30 32 40 C32 50 42 58 50 58 C58 58 68 50 68 40 C68 30 60 20 50 20 Z' fill='%23ffffff'/><path d='M50 58 C38 58 26 68 34 80 C42 92 52 80 50 58 Z' fill='%23ffffff'/><path d='M50 58 C62 58 74 68 66 80 C58 92 48 80 50 58 Z' fill='%23ffffff'/><path d='M47 58 L43 88 L53 88 L49 58 Z' fill='%23ffffff'/></svg>">

  <!-- SEO Optimization Meta Tags -->
  <title>PAO Zone | Πρόγραμμα Παναθηναϊκού FC & BC, Κανάλι Μετάδοσης & Live Αγώνες</title>
  <meta name="description" content="Δείτε το πλήρες πρόγραμμα του Παναθηναϊκού σε ποδόσφαιρο (PAO FC) και μπάσκετ (PAO BC). Ώρες αγώνων, ζωντανές μεταδόσεις, κανάλια (Cosmote, Nova, ΕΡΤ, ΣΚΑΪ) και επόμενοι αγώνες.">
  <meta name="keywords" content="Παναθηναϊκός, πρόγραμμα Παναθηναϊκού, PAO BC, PAO FC, πότε παίζει ο Παναθηναϊκός, κανάλι Παναθηναϊκός, EuroLeague, Super League, PAO Zone">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://paozone.gr">

  <!-- OpenGraph / Facebook / Messaging Apps -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://paozone.gr/">
  <meta property="og:title" content="PAO Zone | Πρόγραμμα & Κανάλι Μετάδοσης Παναθηναϊκού (FC & BC)">
  <meta property="og:description" content="Όλοι οι αγώνες του Παναθηναϊκού σε Ποδόσφαιρο και Μπάσκετ. Ώρες έναρξης στην τοπική σας ώρα και κανάλια μετάδοσης.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --pao-green: #008744;
      --pao-emerald: #10b981;
      --pao-dark-green: #004d25;
      --pao-black: #080f0b;
      --pao-card-bg: rgba(18, 30, 23, 0.85);
      --pao-border: rgba(16, 185, 129, 0.2);
      --pao-border-hover: rgba(16, 185, 129, 0.5);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--pao-black);
      color: var(--text-main);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 135, 68, 0.3), transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.1), transparent 50%);
      background-attachment: fixed;
      padding-bottom: 60px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      padding: 16px 0;
      border-bottom: 1px solid var(--pao-border);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 15, 11, 0.9);
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-logo-wrap {
      width: 44px;
      height: 44px;
      background: var(--pao-green);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 0 15px rgba(0, 135, 68, 0.5);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, var(--pao-emerald));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .btn-group {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--pao-border);
      border-radius: 10px;
      padding: 3px;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-btn.active {
      background: var(--pao-green);
      color: white;
      box-shadow: 0 2px 10px rgba(0, 135, 68, 0.4);
    }

    .search-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--pao-border);
      color: white;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      width: 170px;
      transition: border 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--pao-emerald);
    }

    .hero-section {
      margin: 28px 0;
    }

    .section-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--pao-emerald);
      font-weight: 800;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .today-badge {
      background: #ef4444;
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .hero-card {
      background: linear-gradient(145deg, rgba(0, 77, 37, 0.45), rgba(8, 15, 11, 0.95));
      border: 1px solid var(--pao-emerald);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(16, 185, 129, 0.1);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      position: relative;
    }

    .hero-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .hero-badge-wrap {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(0, 135, 68, 0.25);
      border: 1px solid var(--pao-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }

    .hero-team-name {
      font-size: 19px;
      font-weight: 800;
    }

    .hero-center {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .hero-tv {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--gold);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .countdown {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .count-unit {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--pao-border);
      padding: 8px 12px;
      border-radius: 10px;
      min-width: 54px;
    }

    .count-num {
      font-size: 20px;
      font-weight: 800;
      color: var(--pao-emerald);
      display: block;
    }

    .count-label {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .match-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    .match-card {
      background: var(--pao-card-bg);
      border: 1px solid var(--pao-border);
      border-radius: 16px;
      padding: 20px;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .match-card:hover {
      border-color: var(--pao-border-hover);
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .competition-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .team-type-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .tag-bc { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .tag-fc { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

    .teams-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }

    .team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .team-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
    }

    .card-shamrock-icon {
      font-size: 20px;
      line-height: 1;
    }

    .tv-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f3f4f6;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }

    .card-bottom {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 12px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .match-time-local {
      color: var(--pao-emerald);
      font-weight: 800;
      font-size: 13px;
    }

    @media (max-width: 820px) {
      .controls { width: 100%; flex-direction: column; align-items: stretch; gap: 10px; }
      .btn-group { justify-content: space-between; }
      .search-input { width: 100%; }
      .hero-card { grid-template-columns: 1fr; text-align: center; }
      .match-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container header-inner">
      <a href="#" class="brand">
        <div class="brand-logo-wrap">☘</div>
        <div class="brand-title">PAO ZONE</div>
      </a>

      <div class="controls" id="controlsBar">
        <div class="btn-group">
          <button class="filter-btn active" onclick="setTeamFilter('ALL', this)">ALL</button>
          <button class="filter-btn" onclick="setTeamFilter('BC', this)">🏀 PAO BC</button>
          <button class="filter-btn" onclick="setTeamFilter('FC', this)">⚽ PAO FC</button>
        </div>

        <div class="btn-group">
          <button class="filter-btn active" onclick="setTypeFilter('ALL', this)">All Games</button>
          <button class="filter-btn" onclick="setTypeFilter('FRIENDLY', this)">Friendlies</button>
        </div>

        <div class="btn-group">
          <button class="filter-btn active" onclick="setStatusFilter('UPCOMING', this)">Upcoming</button>
          <button class="filter-btn" onclick="setStatusFilter('RESULTS', this)">Results</button>
        </div>

        <input type="text" class="search-input" id="searchBox" placeholder="Search team, TV..." oninput="handleSearch()">
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero-section" id="heroSection">
      <div class="section-title">
        <span>FEATURED MATCH</span>
        <span class="today-badge">🚨 GAMEDAY / TODAY</span>
      </div>

      <div class="hero-card">
        <div class="hero-team">
          <div class="hero-badge-wrap">☘</div>
          <div class="hero-team-name">Panathinaikos BC</div>
        </div>

        <div class="hero-center">
          <div class="hero-tv">📺 SKAI TV / ERTFLIX</div>
          <div style="font-size: 13px; color: var(--text-muted); font-weight: 600;">8th Pavlos Giannakopoulos Tournament</div>
          <div style="font-size: 13px; color: var(--pao-emerald); font-weight: 800; margin-top: 2px;" id="heroLocalTime">--:--</div>
          
          <div class="countdown">
            <div class="count-unit"><span class="count-num" id="cd-h">00</span><span class="count-label">HRS</span></div>
            <div class="count-unit"><span class="count-num" id="cd-m">00</span><span class="count-label">MIN</span></div>
            <div class="count-unit"><span class="count-num" id="cd-s">00</span><span class="count-label">SEC</span></div>
          </div>
        </div>

        <div class="hero-team">
          <div class="hero-badge-wrap">🏀</div>
          <div class="hero-team-name">JL Bourg-en-Bresse</div>
        </div>
      </div>
    </section>

    <section>
      <div class="section-title" id="gridTitle">UPCOMING FIXTURES (SOONEST FIRST)</div>
      <div class="match-grid" id="matchGrid"></div>
    </section>
  </main>

  <script>
    const matchesData = [
      {
        id: 1,
        team: 'BC',
        opponent: 'JL Bourg-en-Bresse',
        competition: 'Pavlos Giannakopoulos Tournament',
        isFriendly: true,
        home: true,
        isoDate: '2026-09-18T18:15:00Z',
        tv: 'SKAI TV / ERTFLIX',
        status: 'UPCOMING'
      },
      {
        id: 2,
        team: 'BC',
        opponent: 'Partizan / Anadolu Efes',
        competition: 'Pavlos Giannakopoulos Tournament Final',
        isFriendly: true,
        home: true,
        isoDate: '2026-09-19T17:00:00Z',
        tv: 'SKAI TV / ERTFLIX',
        status: 'UPCOMING'
      },
      {
        id: 3,
        team: 'FC',
        opponent: 'Kalamata FC',
        competition: 'Super League Greece',
        isFriendly: false,
        home: false,
        isoDate: '2026-09-20T16:30:00Z',
        tv: 'Cosmote Sport 1 HD',
        status: 'UPCOMING'
      },
      {
        id: 4,
        team: 'BC',
        opponent: 'Paris Basketball',
        competition: 'EuroLeague Round 1',
        isFriendly: false,
        home: true,
        isoDate: '2026-09-24T18:15:00Z',
        tv: 'NovaSports Prime',
        status: 'UPCOMING'
      },
      {
        id: 5,
        team: 'BC',
        opponent: 'LDLC ASVEL',
        competition: 'EuroLeague Round 2',
        isFriendly: false,
        home: true,
        isoDate: '2026-09-30T18:15:00Z',
        tv: 'NovaSports 4',
        status: 'UPCOMING'
      },
      {
        id: 6,
        team: 'FC',
        opponent: 'Olympiacos FC',
        competition: 'Super League Greece (Derby)',
        isFriendly: false,
        home: false,
        isoDate: '2026-10-11T17:30:00Z',
        tv: 'Cosmote Sport 1 HD',
        status: 'UPCOMING'
      },
      {
        id: 7,
        team: 'BC',
        opponent: 'Maccabi Tel Aviv',
        competition: 'Pre-Season Friendly',
        isFriendly: true,
        home: false,
        isoDate: '2026-09-12T17:00:00Z',
        tv: 'ERT3',
        status: 'RESULTS',
        score: '89 - 81 (W)'
      }
    ];

    let currentTeam = 'ALL';
    let currentType = 'ALL';
    let currentStatus = 'UPCOMING';
    let searchQuery = '';

    function formatLocalDateTime(isoString) {
      const date = new Date(isoString);
      const dateStr = date.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
      const timeStr = date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
      return `${dateStr} @ ${timeStr}`;
    }

    function renderHero() {
      const gamedayMatch = matchesData.find(m => m.id === 1);
      if (gamedayMatch) {
        document.getElementById('heroLocalTime').innerText = '🕒 Kickoff: ' + formatLocalDateTime(gamedayMatch.isoDate);
        startCountdown(new Date(gamedayMatch.isoDate));
      }
    }

    function startCountdown(targetDate) {
      function update() {
        const now = new Date();
        const diff = targetDate - now;

        if (diff <= 0) {
          document.getElementById('cd-h').innerText = '00';
          document.getElementById('cd-m').innerText = '00';
          document.getElementById('cd-s').innerText = '00';
          return;
        }

        const hours = Math.floor(diff / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('cd-h').innerText = String(hours).padStart(2, '0');
        document.getElementById('cd-m').innerText = String(mins).padStart(2, '0');
        document.getElementById('cd-s').innerText = String(secs).padStart(2, '0');
      }
      update();
      setInterval(update, 1000);
    }

    function renderMatches() {
      const grid = document.getElementById('matchGrid');
      grid.innerHTML = '';

      let filtered = matchesData.filter(m => {
        if (currentTeam !== 'ALL' && m.team !== currentTeam) return false;
        if (currentType === 'FRIENDLY' && !m.isFriendly) return false;
        if (m.status !== currentStatus) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          return m.opponent.toLowerCase().includes(q) || 
                 m.tv.toLowerCase().includes(q) || 
                 m.competition.toLowerCase().includes(q);
        }
        return true;
      });

      filtered.sort((a, b) => {
        const dateA = new Date(a.isoDate);
        const dateB = new Date(b.isoDate);
        return currentStatus === 'UPCOMING' ? dateA - dateB : dateB - dateA;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">No matches found matching your selection.</div>`;
        return;
      }

      filtered.forEach(m => {
        const card = document.createElement('div');
        card.className = 'match-card';

        const paoTitle = m.team === 'BC' ? 'Panathinaikos BC' : 'Panathinaikos FC';
        const homeTeam = m.home ? paoTitle : m.opponent;
        const awayTeam = m.home ? m.opponent : paoTitle;

        const homeIcon = m.home ? '<span class="card-shamrock-icon">☘</span>' : '<span class="card-shamrock-icon">🛡️</span>';
        const awayIcon = !m.home ? '<span class="card-shamrock-icon">☘</span>' : '<span class="card-shamrock-icon">🛡️</span>';

        card.innerHTML = `
          <div>
            <div class="card-top">
              <span class="competition-badge">${m.competition}</span>
              <span class="team-type-tag ${m.team === 'BC' ? 'tag-bc' : 'tag-fc'}">${m.team}</span>
            </div>

            <div class="teams-container">
              <div class="team-row">
                <div class="team-info">
                  ${homeIcon}
                  <span>${homeTeam}</span>
                </div>
                ${m.status === 'RESULTS' ? `<span style="font-weight:800">${m.score.split('-')[0]}</span>` : ''}
              </div>
              <div class="team-row">
                <div class="team-info">
                  ${awayIcon}
                  <span>${awayTeam}</span>
                </div>
                ${m.status === 'RESULTS' ? `<span style="font-weight:800">${m.score.split('-')[1]}</span>` : ''}
              </div>
            </div>

            <div class="tv-badge">
              📺 Broadcast: <strong style="color:var(--pao-emerald);">${m.tv}</strong>
            </div>
          </div>

          <div class="card-bottom">
            <span>Matchday</span>
            <span class="match-time-local">${formatLocalDateTime(m.isoDate)}</span>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function setTeamFilter(team, el) {
      currentTeam = team;
      updateActiveBtn(el);
      renderMatches();
    }

    function setTypeFilter(type, el) {
      currentType = type;
      updateActiveBtn(el);
      renderMatches();
    }

    function setStatusFilter(status, el) {
      currentStatus = status;
      document.getElementById('gridTitle').innerText = status === 'UPCOMING' ? 'UPCOMING FIXTURES (SOONEST FIRST)' : 'PAST MATCH RESULTS';
      updateActiveBtn(el);
      renderMatches();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchBox').value;
      renderMatches();
    }

    function updateActiveBtn(el) {
      const parent = el.parentElement;
      parent.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
    }

    renderHero();
    renderMatches();
  </script>
</body>
</html>
