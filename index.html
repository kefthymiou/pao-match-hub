  <meta property="og:description" content="Όλοι οι αγώνες του Παναθηναϊκού σε Ποδόσφαιρο και Μπάσκετ. Ώρες έναρξης στην τοπική σας ώρα και κανάλια μετάδοσης.">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --pao-green: #008744;
      --pao-emerald: #10b981;
      --pao-dark-green: #004d25;
      --pao-black: #080f0b;
      --pao-card-bg: rgba(18, 30, 23, 0.85);
      --pao-border: rgba(16, 185, 129, 0.2);
      --pao-border-hover: rgba(16, 185, 129, 0.5);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--pao-black);
      color: var(--text-main);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 135, 68, 0.3), transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.1), transparent 50%);
      background-attachment: fixed;
      padding-bottom: 60px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      padding: 16px 0;
      border-bottom: 1px solid var(--pao-border);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 15, 11, 0.9);
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-logo-wrap {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, var(--pao-emerald));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .menu-toggle-btn {
      display: none;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--pao-border);
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .btn-group {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--pao-border);
      border-radius: 10px;
      padding: 3px;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-btn.active {
      background: var(--pao-green);
      color: white;
      box-shadow: 0 2px 10px rgba(0, 135, 68, 0.4);
    }

    .search-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--pao-border);
      color: white;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      width: 170px;
      transition: border 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--pao-emerald);
    }

    .hero-section {
      margin: 28px 0;
    }

    .section-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--pao-emerald);
      font-weight: 800;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .today-badge {
      background: #ef4444;
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .hero-card {
      background: linear-gradient(145deg, rgba(0, 77, 37, 0.45), rgba(8, 15, 11, 0.95));
      border: 1px solid var(--pao-emerald);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(16, 185, 129, 0.1);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      position: relative;
    }

    .hero-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .hero-badge-wrap {
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-team-name {
      font-size: 19px;
      font-weight: 800;
    }

    .hero-center {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .hero-tv {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--gold);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .countdown {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .count-unit {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--pao-border);
      padding: 8px 12px;
      border-radius: 10px;
      min-width: 54px;
    }

    .count-num {
      font-size: 20px;
      font-weight: 800;
      color: var(--pao-emerald);
      display: block;
    }

    .count-label {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .match-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    .match-card {
      background: var(--pao-card-bg);
      border: 1px solid var(--pao-border);
      border-radius: 16px;
      padding: 20px;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .match-card:hover {
      border-color: var(--pao-border-hover);
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .competition-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .team-type-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .tag-bc { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .tag-fc { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

    .teams-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }

    .team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .team-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
    }

    .card-crest-wrap {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .tv-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f3f4f6;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }

    .card-bottom {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 12px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .match-time-local {
      color: var(--pao-emerald);
      font-weight: 800;
      font-size: 13px;
    }

    @media (max-width: 820px) {
      .menu-toggle-btn { display: block; }
      .controls { display: none; width: 100%; flex-direction: column; align-items: stretch; padding-top: 14px; gap: 10px; }
      .controls.open { display: flex; }
      .btn-group { justify-content: space-between; }
      .search-input { width: 100%; }
      .hero-card { grid-template-columns: 1fr; text-align: center; }
      .match-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <header>
    <div class="container header-inner">
      <a href="#" class="brand">
        <div class="brand-logo-wrap" id="headerLogo"></div>
        <div class="brand-title">PAO ZONE</div>
      </a>

      <button class="menu-toggle-btn" onclick="toggleMobileMenu()" aria-label="Toggle Navigation Menu">

      </button>

      <div class="controls" id="controlsBar">
        <div class="btn-group">
          <button class="filter-btn active" onclick="setTeamFilter('ALL', this)">ALL</button>

    let currentTeam = 'ALL';
    let currentType = 'ALL';
    let currentStatus = 'UPCOMING';
    let searchQuery = '';

    function getCrestSVG(type) {
      const tmplId = type === 'BC' ? 'pao-bc-crest' : 'pao-fc-crest';
      const tmpl = document.getElementById(tmplId);
      return tmpl.content.cloneNode(true);
    }

    function formatLocalDateTime(isoString) {
      const date = new Date(isoString);
      const dateStr = date.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
      const timeStr = date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
      return `${dateStr} @ ${timeStr}`;
    }

    function toggleMobileMenu() {
      document.getElementById('controlsBar').classList.toggle('open');
    }

    function renderHero() {
      document.getElementById('headerLogo').appendChild(getCrestSVG('BC'));
      document.getElementById('heroPaoBadge').appendChild(getCrestSVG('BC'));

      const gamedayMatch = matchesData.find(m => m.id === 1);
      if (gamedayMatch) {
        document.getElementById('heroLocalTime').innerText = '🕒 Kickoff: ' + formatLocalDateTime(gamedayMatch.isoDate);
        startCountdown(new Date(gamedayMatch.isoDate));
      }
    }

    function startCountdown(targetDate) {
      function update() {
        const now = new Date();
        const diff = targetDate - now;

        if (diff <= 0) {
          document.getElementById('cd-h').innerText = '00';
          document.getElementById('cd-m').innerText = '00';
          document.getElementById('cd-s').innerText = '00';
          return;
        }

        const hours = Math.floor(diff / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('cd-h').innerText = String(hours).padStart(2, '0');
        document.getElementById('cd-m').innerText = String(mins).padStart(2, '0');
        document.getElementById('cd-s').innerText = String(secs).padStart(2, '0');
      }
      update();
      setInterval(update, 1000);
    }

    function renderMatches() {
      const grid = document.getElementById('matchGrid');
      grid.innerHTML = '';

      let filtered = matchesData.filter(m => {
        if (currentTeam !== 'ALL' && m.team !== currentTeam) return false;
        if (currentType === 'FRIENDLY' && !m.isFriendly) return false;
        if (m.status !== currentStatus) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          return m.opponent.toLowerCase().includes(q) || 
                 m.tv.toLowerCase().includes(q) || 
                 m.competition.toLowerCase().includes(q);
        }
        return true;
      });

      filtered.sort((a, b) => {
        const dateA = new Date(a.isoDate);
        const dateB = new Date(b.isoDate);
        return currentStatus === 'UPCOMING' ? dateA - dateB : dateB - dateA;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">No matches found matching your selection.</div>`;
        return;
      }

      filtered.forEach(m => {
        const card = document.createElement('div');
        card.className = 'match-card';

        const paoTitle = m.team === 'BC' ? 'Panathinaikos BC' : 'Panathinaikos FC';
        const homeTeam = m.home ? paoTitle : m.opponent;
        const awayTeam = m.home ? m.opponent : paoTitle;

        const homeIconContainer = document.createElement('span');
        homeIconContainer.className = 'card-crest-wrap';
        if (m.home) homeIconContainer.appendChild(getCrestSVG(m.team));
        else homeIconContainer.innerHTML = '🛡️';

        const awayIconContainer = document.createElement('span');
        awayIconContainer.className = 'card-crest-wrap';
        if (!m.home) awayIconContainer.appendChild(getCrestSVG(m.team));
        else awayIconContainer.innerHTML = '🛡️';

        card.innerHTML = `
          <div>
            <div class="card-top">
              <span class="competition-badge">${m.competition}</span>
              <span class="team-type-tag ${m.team === 'BC' ? 'tag-bc' : 'tag-fc'}">${m.team}</span>
            </div>

            <div class="teams-container">
              <div class="team-row">
                <div class="team-info">
                  ${homeIconContainer.outerHTML}
                  <span>${homeTeam}</span>
                </div>
                ${m.status === 'RESULTS' ? `<span style="font-weight:800">${m.score.split('-')[0]}</span>` : ''}
              </div>
              <div class="team-row">
                <div class="team-info">
                  ${awayIconContainer.outerHTML}
                  <span>${awayTeam}</span>
                </div>
                ${m.status === 'RESULTS' ? `<span style="font-weight:800">${m.score.split('-')[1]}</span>` : ''}
              </div>
            </div>

            <div class="tv-badge">
              📺 Broadcast: <strong style="color:var(--pao-emerald);">${m.tv}</strong>
            </div>
          </div>

          <div class="card-bottom">
            <span>Matchday</span>
            <span class="match-time-local">${formatLocalDateTime(m.isoDate)}</span>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function setTeamFilter(team, el) {
      currentTeam = team;
      updateActiveBtn(el);
      renderMatches();
    }

    function setTypeFilter(type, el) {
      currentType = type;
      updateActiveBtn(el);
      renderMatches();
    }

    function setStatusFilter(status, el) {
      currentStatus = status;
      document.getElementById('gridTitle').innerText = status === 'UPCOMING' ? 'UPCOMING FIXTURES (SOONEST FIRST)' : 'PAST MATCH RESULTS';
      updateActiveBtn(el);
      renderMatches();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchBox').value;
      renderMatches();
    }

    function updateActiveBtn(el) {
      const parent = el.parentElement;
      parent.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
    }

    renderHero();
    renderMatches();
  </script>
</body>
</html>
